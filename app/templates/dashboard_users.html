<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaya IP Office — Usuários</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#172033;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:22px}.top small{opacity:.75}.wrap{max-width:1450px;margin:auto;padding:24px}.toolbar{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:18px;margin-bottom:18px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #ccd5e2;border-radius:8px}.toolbar input{min-width:190px}.btn{border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#334155}.msg{font-size:13px;margin-left:auto}.context{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.context h2{margin:0;font-size:19px}.meta{color:#64748b;font-size:13px}.table-wrap{background:#fff;border:1px solid #dfe5ee;border-radius:14px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:12px 14px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;color:#64748b;background:#f8fafc}.name{font-weight:800}.mono{font-family:Consolas,monospace}.muted{color:#64748b}.pill{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800}.active{background:#dcfce7;color:#166534}.inactive{background:#fee2e2;color:#991b1b}.btn.small{padding:6px 9px;font-size:11px}.btn.danger{background:#b91c1c}.actions{white-space:nowrap}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.pager button{border:1px solid #ccd5e2;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.pager button:disabled{opacity:.45}.empty{background:#fff;padding:25px;border-radius:12px;color:#64748b}.hidden{display:none}@media(max-width:650px){.wrap{padding:14px}.top{padding:18px}.msg{width:100%;margin-left:0}.context{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="top"><div><h1>AVAYA IP OFFICE</h1><small>Usuários por IPO</small></div><a class="btn secondary" href="/dashboard">← Dashboard</a></header><main class="wrap"><section class="toolbar"><div><label>Usuário</label><input id="username" value="admin"></div><div><label>Senha</label><input id="password" type="password"></div><button class="btn" onclick="login()">Entrar</button><button class="btn secondary" onclick="loadUsers(1)">Atualizar</button><span id="msg" class="msg"></span></section><section id="content" class="hidden"><div class="context"><div><h2 id="systemTitle">Usuários</h2><div id="systemMeta" class="meta"></div></div><div id="totalMeta" class="meta"></div></div><section class="toolbar"><div><label>Nome</label><input id="nameFilter" placeholder="Pesquisar nome"></div><div><label>Ramal</label><input id="extensionFilter" placeholder="Ex.: 1336"></div><div><label>SIP</label><input id="sipFilter" placeholder="Pesquisar SIP"></div><div><label>Categoria</label><input id="categoryFilter" placeholder="Categoria"></div><div><label>Tipo de licen&#231;a</label><select id="licenseFilter"><option value="">Todas</option><option value="1">Basic User</option><option value="2">Teleworker User</option><option value="3">Mobile User</option><option value="4">Power User</option><option value="5">Office Worker User</option><option value="6">Branch User</option><option value="7">Centralized User</option><option value="8">Non-Licensed User</option></select></div><div><label>Status</label><select id="activeFilter"><option value="true">Ativos</option><option value="">Todos</option><option value="false">Inativos</option></select></div><button class="btn" onclick="loadUsers(1)">Filtrar</button><button class="btn secondary" onclick="exportUsers()">Exportar CSV</button></section><div id="tableContainer"></div><div class="pager"><button id="prev" onclick="changePage(-1)">← Anterior</button><span id="pageInfo" class="muted"></span><button id="next" onclick="changePage(1)">Próxima →</button></div></section></main><script>
const tokenKey='avaya_dashboard_token',targetIp=new URLSearchParams(location.search).get('target_ip')||'';let currentPage=1,pageSize=25;
function token(){return localStorage.getItem(tokenKey)}function role(){try{return JSON.parse(atob(token().split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role||''}catch{return ''}}let currentUsers={};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setMsg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.style.color=ok?'#166534':'#92400e'}function formatDate(v){if(!v)return'—';try{return new Date(v).toLocaleString('pt-BR')}catch{return v}}
async function login(){const body=new URLSearchParams({username:username.value,password:password.value});try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();if(!r.ok)throw Error(d.detail||'Falha no login');localStorage.setItem(tokenKey,d.access_token);setMsg('Login realizado.',true);loadUsers(1)}catch(e){setMsg(e.message)}}
function buildUserQuery(page=null){const q=new URLSearchParams({target_ip:targetIp,record_type:'USER'});[['name','nameFilter'],['extension','extensionFilter'],['sip','sipFilter'],['category','categoryFilter']].forEach(([p,id])=>{const value=document.getElementById(id).value.trim();if(value)q.set(p,value)});const pkg=document.getElementById('licenseFilter').value;if(pkg)q.set('assigned_package',pkg);q.set('active',document.getElementById('activeFilter').value||'all');if(page!==null){q.set('page',page);q.set('page_size',pageSize)}return q}
function loadUsers(page=1){const t=token();if(!t){setMsg('Faca login para carregar os usuarios.');return}fetch('/api/users?'+buildUserQuery(page),{headers:{Authorization:`Bearer ${t}`}}).then(async r=>{if(r.status===401){localStorage.removeItem(tokenKey);throw Error('Sessao expirada. Faca login novamente.')}const d=await r.json();if(!r.ok)throw Error(d.detail?.message||d.detail||'Erro ao carregar usuarios');currentPage=d.page;render(d);setMsg('Dados atualizados.',true)}).catch(e=>setMsg(e.message))}
async function exportUsers(){const t=token();if(!t){setMsg('Faca login para exportar os usuarios.');return}try{const r=await fetch('/api/users/export?'+buildUserQuery(),{headers:{Authorization:`Bearer ${t}`}});if(r.status===401){localStorage.removeItem(tokenKey);throw Error('Sessao expirada. Faca login novamente.')}if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail?.message||d.detail||'Erro ao exportar usuarios')}const url=URL.createObjectURL(await r.blob()),link=document.createElement('a');link.href=url;link.download=`usuarios_${targetIp||'todos'}.csv`;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);setMsg('Arquivo CSV exportado.',true)}catch(e){setMsg(e.message)}}
function render(d){currentUsers=Object.fromEntries(d.items.map(u=>[u.id,u]));document.getElementById('content').classList.remove('hidden');document.getElementById('systemTitle').textContent='Usuários do IPO '+targetIp;document.getElementById('systemMeta').textContent='Cache local · record_type=USER · filtro por target_ip';document.getElementById('totalMeta').textContent=`${d.total} registros`;document.getElementById('tableContainer').innerHTML=d.items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>Ramal</th><th>SIP</th><th>Categoria</th><th>Tipo de licenca</th><th>Status</th><th>GUID</th><th>Última visualização</th><th>Acoes</th></tr></thead><tbody>${d.items.map(u=>`<tr><td class="name"><a href="/dashboard/user?id=${u.id}&target_ip=${encodeURIComponent(targetIp)}" style="color:#1d4ed8;text-decoration:none">${esc(u.name||'—')}</a></td><td class="mono">${esc(u.extension||'—')}</td><td class="mono">${esc(u.sip||'—')}</td><td>${esc(u.category||'—')}</td><td>${esc(u.assigned_package_name||'-')}</td><td><span class="pill ${u.active?'active':'inactive'}">${u.active?'ATIVO':'INATIVO'}</span></td><td class="mono muted">${esc(u.guid||'—')}</td><td class="muted">${formatDate(u.last_seen_at||u.source_updated_at)}</td><td class="actions">${(['admin','provisioning'].includes(role())&&u.active?`<button class="btn small" onclick="editUser(${u.id})">Editar</button>`:'')}${(role()==='admin'&&u.active?` <button class="btn small danger" onclick="removeUser(${u.id})">Excluir</button>`:'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum usuário encontrado.</div>';const pages=Math.max(1,Math.ceil(d.total/d.page_size));pageInfo.textContent=`Página ${d.page} de ${pages}`;prev.disabled=d.page<=1;next.disabled=d.page>=pages}async function mutateUser(id,method,body=null){const u=currentUsers[id],t=token();if(!u||!t)return;const url=new URL(`/api/users/${encodeURIComponent(u.guid)}`,location.origin);url.searchParams.set('target_ip',targetIp);if(method==='DELETE')url.searchParams.set('confirm','true');const r=await fetch(url,{method,headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json().catch(()=>({}));if(!r.ok){const detail=d.detail;throw Error(typeof detail==='string'?detail:(detail?.message||JSON.stringify(detail)||'Falha na operacao'))}return d}
async function editUser(id){const u=currentUsers[id];if(!u)return;const name=prompt('Nome de usuario:',u.name||'');if(name===null)return;const extension=prompt('Ramal:',u.extension||'');if(extension===null)return;const sip=prompt('Nome SIP:',u.sip||'');if(sip===null)return;const pkg=prompt('Licenca (1 a 8):',String(u.assigned_package||8));if(pkg===null)return;const body={name:name.trim(),extension:extension.trim(),sip_name:sip.trim(),assigned_package:Number(pkg)};try{await mutateUser(id,'PUT',body);setMsg('Usuario atualizado no IPO.',true);loadUsers(currentPage)}catch(e){setMsg(e.message)}}
async function removeUser(id){const u=currentUsers[id];if(!u)return;if(!confirm(`Excluir definitivamente no IPO ${targetIp}?\n\nUsuario: ${u.name||'(sem nome)'}\nRamal: ${u.extension||'(sem ramal)'}\n\nEsta acao nao pode ser desfeita.`))return;try{await mutateUser(id,'DELETE');setMsg('Usuario excluido do IPO.',true);loadUsers(currentPage)}catch(e){setMsg(e.message)}}
function changePage(delta){loadUsers(currentPage+delta)}if(token())loadUsers(1);
</script></body></html>
