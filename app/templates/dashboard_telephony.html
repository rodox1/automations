<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramais e grupos | Avaya IP Office</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#172033;color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}.wrap{max-width:1450px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.field input,.field select{padding:10px;border:1px solid #ccd5e2;border-radius:8px;min-width:170px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#334155}.danger{background:#b91c1c}.msg{margin-left:auto;font-size:13px}.tabs{display:flex;gap:8px;margin:14px 0}.tab{padding:10px 15px;border:1px solid #cbd5e1;border-radius:9px;color:#334155;cursor:pointer;background:white}.tab.on{background:#dbeafe;border-color:#60a5fa;color:#1d4ed8;font-weight:700}.table-wrap{overflow:auto;border:1px solid #dfe5ee;border-radius:12px;background:white}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px 13px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}.table th{font-size:11px;text-transform:uppercase;background:#f8fafc;color:#64748b}.mono{font-family:Consolas,monospace}.muted{color:#64748b}.status{padding:3px 8px;border-radius:20px;background:#dcfce7;color:#166534;font-size:11px;font-weight:800}.hidden{display:none}.member{max-width:300px;overflow-wrap:anywhere}@media(max-width:650px){.wrap{padding:12px}.top{padding:16px}.msg{width:100%;margin:8px 0}}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}.pager button{border:1px solid #ccd5e2;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.pager button:disabled{opacity:.45;cursor:default}.pager select{padding:8px;border:1px solid #ccd5e2;border-radius:8px}@media(max-width:650px){.pager{flex-wrap:wrap}}</style></head><body><header class="top"><div><h1>Ramais e grupos de ramais</h1><small>Avaya IP Office Management API · cache multi-IPO</small></div><a class="btn secondary" href="/dashboard">Dashboard</a></header><main class="wrap">
<section class="panel row"><div class="field"><label>IPO selecionado</label><input id="ip" placeholder="10.0.0.10"></div><button class="btn secondary" onclick="load()">Atualizar lista</button><span id="msg" class="msg"></span></section>
<section class="panel"><div class="tabs"><button id="extTab" class="tab on" onclick="setKind('extensions')">Ramais</button><button id="groupTab" class="tab" onclick="setKind('huntgroups')">Grupos de ramais</button></div><div class="row"><div class="field"><label>Pesquisar ramal, nome ou membro</label><input id="search" placeholder="Buscar" onkeydown="if(event.key==='Enter')load(1)"></div><div class="field"><label>Status</label><select id="active"><option value="all">Todos</option><option value="true">Ativos</option><option value="false">Inativos</option></select></div><button class="btn" onclick="load(1)">Filtrar</button><button class="btn secondary" onclick="exportCsv()">Exportar CSV</button></div></section>
<section class="panel"><h3 id="formTitle">Adicionar ramal</h3><div id="extensionForm" class="row"><div class="field"><label>Número do ramal</label><input id="newExt" inputmode="numeric" placeholder="Ex.: 406"></div><div class="field"><label>Tipo</label><select id="newType"><option value="0">Normal</option><option value="1">H.323</option><option value="2">ADMM</option><option value="3">SIP</option><option value="4">D100</option></select></div><button class="btn" onclick="createItem()">Criar ramal</button></div><div id="groupForm" class="row hidden"><div class="field"><label>Nome (até 15 caracteres)</label><input id="newName" maxlength="15"></div><div class="field"><label>Ramal do grupo</label><input id="newGroupExt" inputmode="numeric"></div><div class="field"><label>Membros (separados por vírgula)</label><input id="newMembers" placeholder="201,202,203" style="min-width:280px"></div><div class="field"><label>Toque</label><select id="newRing"><option value="0">Collective</option><option value="1">Sequential</option><option value="2">Rotary</option><option value="3">Longest Waiting</option><option value="4">Collective Call Waiting</option></select></div><button class="btn" onclick="createItem()">Criar grupo</button></div></section>
<div id="table"></div><div id="pager" class="pager hidden"><button id="prev" onclick="load(currentPage-1)">Anterior</button><span id="pageInfo" class="muted"></span><label class="muted">Itens por pagina <select id="pageSize" onchange="load(1)"><option>25</option><option>50</option><option>100</option></select></label><button id="next" onclick="load(currentPage+1)">Proxima</button></div></main><script>
const tokenKey='avaya_dashboard_token',params=new URLSearchParams(location.search);let kind=params.get('kind')==='huntgroups'?'huntgroups':'extensions',displayed=[],currentPage=1;const ip=document.getElementById('ip'),msg=document.getElementById('msg');ip.value=params.get('target_ip')||'';
function token(){return localStorage.getItem(tokenKey)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function say(s,ok=false){msg.textContent=s;msg.style.color=ok?'#166534':'#92400e'}
async function request(path,opts={}){const h={Authorization:'Bearer '+token(),...(opts.headers||{})};const r=await fetch(path,{...opts,headers:h});if(r.status===401){localStorage.removeItem(tokenKey);throw Error('Sessão expirada. Entre novamente.')}if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.detail?.message||d.detail||'Falha na operação')}return r}
function setKind(v){kind=v;extTab.classList.toggle('on',v==='extensions');groupTab.classList.toggle('on',v==='huntgroups');extensionForm.classList.toggle('hidden',v!=='extensions');groupForm.classList.toggle('hidden',v!=='huntgroups');formTitle.textContent=v==='extensions'?'Adicionar ramal':'Adicionar grupo de ramais';load(1)}
function query(page=null){const q=new URLSearchParams({active:active.value});if(ip.value.trim())q.set('target_ip',ip.value.trim());if(search.value.trim())q.set('search',search.value.trim());if(page!==null){q.set('page',page);q.set('page_size',pageSize.value)}return q}
async function load(page=1){if(!token()){say('Entre no Dashboard para carregar os dados.');return}try{const r=await request('/api/'+kind+'?'+query(page)),d=await r.json();currentPage=d.page;render(d);say(`${d.total} registro(s) encontrados.`,true)}catch(e){say(e.message)}}
async function exportCsv(){try{const r=await request('/api/'+kind+'/export?'+query()),blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=kind+'_'+(ip.value||'todos')+'.csv';a.click();URL.revokeObjectURL(url);say('CSV exportado.',true)}catch(e){say(e.message)}}
async function createItem(){if(!ip.value.trim()){say('Informe o IP do IPO.');return}try{let body;if(kind==='extensions')body={extension:newExt.value.trim(),type_info:Number(newType.value)};else body={name:newName.value.trim(),extension:newGroupExt.value.trim(),members:newMembers.value.split(',').map(x=>x.trim()).filter(Boolean),group_ring_mode:Number(newRing.value),service_mode:1,voicemail_on:false,is_group_distributed:false};const r=await request('/api/'+kind+'?target_ip='+encodeURIComponent(ip.value.trim()),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();say(`Criado com sucesso. Ramal ${d.extension}.`,true);load()}catch(e){say(e.message)}}
async function editItem(index){const x=displayed[index];try{let body;if(kind==='extensions'){const number=prompt('Novo número do ramal:',x.extension);if(number===null)return;body={extension:number.trim(),type_info:x.type_info??0}}else{const name=prompt('Nome do grupo:',x.name||'');if(name===null)return;const number=prompt('Ramal do grupo:',x.extension);if(number===null)return;const members=prompt('Membros separados por vírgula:',(x.members||[]).join(','));if(members===null)return;body={name:name.trim(),extension:number.trim(),members:members.split(',').map(v=>v.trim()).filter(Boolean),group_ring_mode:x.group_ring_mode??0,service_mode:x.service_mode??1,voicemail_on:!!x.voicemail_on,is_group_distributed:!!x.is_group_distributed}}const r=await request('/api/'+kind+'/'+encodeURIComponent(x.guid)+'?target_ip='+encodeURIComponent(ip.value.trim()),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();say(`Atualizado: ramal ${d.extension}.`,true);load()}catch(e){say(e.message)}}
async function removeItem(index){const x=displayed[index];if(!confirm(`Excluir ${kind==='extensions'?'ramal':'grupo'} ${x.extension} do IPO ${ip.value}? Esta ação altera a configuração real do Avaya.`))return;try{await request('/api/'+kind+'/'+encodeURIComponent(x.guid)+'?target_ip='+encodeURIComponent(ip.value.trim())+'&confirm=true',{method:'DELETE'});say('Registro excluído.',true);load()}catch(e){say(e.message)}}
function render(d){const group=kind==='huntgroups',rows=d.items||[];displayed=rows;let head=group?'<th>Nome</th><th>Ramal</th><th>Membros</th><th>Distribuicao</th><th>Servico</th>':'<th>Ramal</th><th>Tipo</th><th>ID fisico</th><th>Modulo / Porta</th><th>Local</th>';document.getElementById('table').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr>${head}<th>IPO</th><th>Status</th><th>Acoes</th></tr></thead><tbody>${rows.map((x,i)=>`<tr>${group?`<td><b>${esc(x.name||'')}</b></td><td class="mono">${esc(x.extension)}</td><td class="member">${esc((x.members||[]).join(', '))}</td><td>${esc(x.group_ring_mode_name||'')}</td><td>${esc(x.service_mode_name||'')}</td>`:`<td class="mono"><b>${esc(x.extension)}</b></td><td>${esc(x.type_name)}</td><td>${esc(x.physical_id??'-')}</td><td>${esc(x.module??'-')} / ${esc(x.port??'-')}</td><td>${esc(x.location??'-')}</td>`}<td class="mono">${esc(x.target_ip)}</td><td><span class="status">${x.active?'ATIVO':'INATIVO'}</span></td><td>${x.active?`<button class="btn secondary" onclick="editItem(${i})">Editar</button> <button class="btn danger" onclick="removeItem(${i})">Excluir</button>`:'?'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel muted">Nenhum registro encontrado para os filtros selecionados.</div>';const pages=Math.max(1,Math.ceil(d.total/d.page_size)),start=d.total?((d.page-1)*d.page_size)+1:0,end=Math.min(d.page*d.page_size,d.total);document.getElementById('pager').classList.toggle('hidden',d.total===0);document.getElementById('pageInfo').textContent=`Exibindo ${start}-${end} de ${d.total} | Pagina ${d.page} de ${pages}`;document.getElementById('prev').disabled=d.page<=1;document.getElementById('next').disabled=d.page>=pages}
if(kind==='huntgroups')setKind(kind);else if(token())load();
</script></body></html>
