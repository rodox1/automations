<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaya IP Office — Dashboard</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#172033;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}.top h1{margin:0;font-size:22px}.top small{opacity:.75}.top-actions{display:flex;align-items:center;gap:12px}.btn.logout{background:#475569}.wrap{max-width:1400px;margin:auto;padding:24px}.login{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:18px;margin-bottom:20px;display:flex;gap:10px;align-items:end;flex-wrap:wrap}.login label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.login input{padding:10px 12px;border:1px solid #ccd5e2;border-radius:8px;min-width:160px}.login .ip{width:170px}.btn{border:0;border-radius:8px;padding:10px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#334155}.btn.sync{background:#0891b2}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{font-size:13px;margin-left:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:18px}.label{font-size:12px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.value{font-size:30px;font-weight:800;margin:7px 0}.sub{font-size:13px;color:#64748b}.status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}.ok{background:#dcfce7;color:#166534}.warning{background:#fef3c7;color:#92400e}.partial{background:#dbeafe;color:#1e40af}.unknown{background:#e2e8f0;color:#475569}.section{margin-top:22px}.section h2{font-size:16px;margin:0 0 12px}.systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.system{background:#fff;border:1px solid #dfe5ee;border-radius:14px;padding:18px;transition:.15s;cursor:pointer}.system:hover{border-color:#93c5fd;box-shadow:0 4px 14px rgba(20,30,50,.08);transform:translateY(-2px)}.system-head{display:flex;justify-content:space-between;gap:15px;margin-bottom:10px}.system-name{font-size:18px;font-weight:800}.role{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:800}.ip{font-family:Consolas,monospace;font-size:12px;color:#64748b}.stats{display:flex;gap:10px;margin-bottom:12px}.stat{flex:1}.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:#64748b}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.actions .btn{font-size:12px;padding:8px 10px;text-align:center}.empty{background:#fff;padding:40px;border-radius:12px;color:#64748b;text-align:center}.footer{margin-top:18px;color:#64748b;font-size:13px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.login{flex-direction:column;align-items:stretch}}
</style></head><body>
<header class="top">
  <div><h1>AVAYA IP OFFICE</h1><small>Dashboard operacional</small></div>
  <div class="top-actions"><div id="overall" style="text-align:right"></div><button class="btn logout" onclick="logout()">Sair</button></div>
</header>
<main class="wrap">
<section class="login">
  <div id="usernameField" style="display:flex;flex-direction:column;gap:6px;min-width:150px">
    <label>Usuário</label><input id="username" value="admin">
  </div>
  <div id="passwordField" style="display:flex;flex-direction:column;gap:6px;min-width:150px">
    <label>Senha</label><input id="password" type="password">
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;min-width:150px">
    <label>IP do IPO para sincronizar</label><input id="target_ip" type="text" inputmode="decimal" autocomplete="off" placeholder="192.0.2.10" class="ip" required>
  </div>
  <button id="loginButton" class="btn" onclick="login()">Entrar</button>
  <button class="btn secondary" onclick="loadDashboard()">Atualizar</button>
  <button class="btn sync" onclick="syncIpo()">Sincronizar IPO</button>
  <span id="msg" class="msg"></span>
</section>
<section id="content" class="hidden">
  <div class="grid">
    <div class="card">
      <div class="label">IPOs</div><div id="systemsValue" class="value">—</div><div id="systemsSub" class="sub">—</div>
    </div>
    <div class="card">
      <div class="label">Cobertura</div><div id="coverageValue" class="value">—</div><div id="coverageStatus"></div><div class="bar" style="background:#e2e8f0;height:8px;border-radius:4px;margin-top:6px"><div id="coverageBar" style="background:#2563eb;height:8px;border-radius:4px;width:0%"></div></div>
    </div>
    <div class="card"><div class="label">Usu&#225;rios</div><div id="usersValue" class="value">-</div><div id="usersSub" class="sub">-</div></div>
    <div class="card"><div class="label">Ramais</div><div id="extensionsValue" class="value">-</div><div id="extensionsSub" class="sub">-</div></div>
    <div class="card"><div class="label">Grupos de ramais</div><div id="groupsValue" class="value">-</div><div id="groupsSub" class="sub">-</div></div>
    <div class="card">
      <div class="label">Falhas de Sync</div><div id="syncValue" class="value">—</div><div id="syncStatus"></div>
    </div>
  </div>
  <section class="section">
    <h2>Sistemas descobertos</h2>
    <div id="systems" class="systems"></div>
  </section>
  <section class="section">
    <h2>Últimas falhas de sincronização</h2>
    <div id="failures"></div>
  </section>
  <div id="updated" class="footer"></div>
</section>
</main>
<script>
const tokenKey='avaya_dashboard_token',dashboardTargetKey='avaya_dashboard_target_ip';function token(){return localStorage.getItem(tokenKey)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function badge(s){return `<span class="status ${esc(s)}">${esc(s)}</span>`}function setMsg(t,ok=false){const e=document.getElementById('msg');e.textContent=t;e.style.color=ok?'#166534':'#92400e'}
async function _api(path,opts={},auth=true){const {skipAuth=false,...init}=opts;const t=token();const headers={...init.headers};if(auth&&!skipAuth){if(!t)throw Error('Sessão não encontrada. Faça login.');headers.Authorization=`Bearer ${t}`}const r=await fetch(path,{...init,headers});if(r.status===401&&auth&&!skipAuth){localStorage.removeItem(tokenKey);sessionStorage.removeItem(dashboardTargetKey);throw Error('Sessão expirada. Faça login novamente.')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:(d.detail?.message||JSON.stringify(d.detail)||'Erro na requisicao'));return d}
let activeTargetIp=token()?sessionStorage.getItem(dashboardTargetKey):null;
async function login(){const body=new URLSearchParams({username:username.value,password:password.value});try{const d=await _api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body,skipAuth:true});localStorage.setItem(tokenKey,d.access_token);sessionStorage.removeItem(dashboardTargetKey);activeTargetIp=null;document.getElementById('content').classList.add('hidden');setMsg('Login realizado. Sincronize com um IPO para carregar os dados.',true)}catch(e){setMsg(e.message)}}
function logout(){localStorage.removeItem(tokenKey);sessionStorage.removeItem(dashboardTargetKey);activeTargetIp=null;document.getElementById('content').classList.add('hidden');document.getElementById('overall').textContent='';document.getElementById('password').value='';setMsg('Sessão encerrada.',true)}
async function loadDashboard(targetIp=activeTargetIp){const t=token();if(!t){setMsg('Faça login para carregar o dashboard.');return}if(!targetIp){setMsg('Sincronize com um IPO para carregar os dados.');return}try{const d=await _api('/api/dashboard/overview?target_ip='+encodeURIComponent(targetIp));activeTargetIp=targetIp;sessionStorage.setItem(dashboardTargetKey,targetIp);document.getElementById('target_ip').value=targetIp;render(d);setMsg('Dados atualizados para o IPO '+targetIp+'.',true)}catch(e){setMsg(e.message)}}
async function syncIpo(){const ip=document.getElementById('target_ip').value.trim();const btn=document.querySelector('.btn.sync');const orig=btn.textContent;try{if(!token())throw Error('Faça login antes de sincronizar.');if(!ip)throw Error('Informe o IP do IPO antes de sincronizar.');activeTargetIp=null;sessionStorage.removeItem(dashboardTargetKey);document.getElementById('content').classList.add('hidden');btn.disabled=true;btn.textContent='Sincronizando...';const d=await _api('/api/ipo/sync?target_ip='+encodeURIComponent(ip),{method:'POST'});activeTargetIp=ip;sessionStorage.setItem(dashboardTargetKey,ip);setMsg(`Sincronização concluída: ${d.systems.count} sistema(s), ${d.users.count} usuário(s), ${d.extensions.count} ramal(is), ${d.huntgroups.count} grupo(s).`,true);await loadDashboard(ip)}catch(e){setMsg(e.message)}finally{btn.disabled=false;btn.textContent=orig}}
function formatDate(v){if(!v)return'—';try{return new Date(v).toLocaleString('pt-BR')}catch{return v}}
function render(d){document.getElementById('content').classList.remove('hidden');document.getElementById('overall').innerHTML=badge(d.status);document.getElementById('systemsValue').textContent=`${d.coverage.discovered} / ${d.scope.expected_systems}`;document.getElementById('systemsSub').textContent=`${d.systems.active} ativos · ${d.systems.inactive} inativos`;document.getElementById('coverageValue').textContent=`${d.coverage.percentage}%`;document.getElementById('coverageStatus').innerHTML=badge(d.coverage.status);document.getElementById('coverageBar').style.width=Math.min(100,Math.max(0,d.coverage.percentage))+'%';document.getElementById('usersValue').textContent=d.users.total;document.getElementById('usersSub').textContent=`${d.users.active} ativos · ${d.users.inactive} inativos`;document.getElementById('extensionsValue').textContent=d.extensions.total;document.getElementById('extensionsSub').textContent=`${d.extensions.active} ativos - ${d.extensions.inactive} inativos`;document.getElementById('groupsValue').textContent=d.huntgroups.total;document.getElementById('groupsSub').textContent=`${d.huntgroups.active} ativos - ${d.huntgroups.inactive} inativos`;document.getElementById('syncValue').textContent=d.sync.failed_system_syncs;document.getElementById('syncStatus').innerHTML=badge(d.sync.status);const items=d.items||[];document.getElementById('systems').innerHTML=items.length?items.map(s=>`<article class="system" onclick="location.href='/dashboard/users?target_ip=${encodeURIComponent(s.target_ip||'')}'"><div class="system-head"><div><div class="role">${esc(s.role)}</div><div class="system-name">${esc(s.name||'Sem nome')}</div><div class="ip">${esc(s.target_ip||'—')}</div></div><div>${badge(s.status.active?'ok':'warning')}</div></div><div class="stats"><div class="stat"><b>${s.users?.total||0}</b><span>usuários</span></div><div class="stat"><b>${s.users?.active||0}</b><span>ativos</span></div><div class="stat"><b>${esc(s.version?.major||'—')}.${esc(s.version?.minor||'—')}</b><span>versão</span></div></div><div class="sub" style="margin-top:12px">Config ${esc(s.version?.configuration||'—')} · Build ${esc(s.version?.build||'—')} · Última sync ${formatDate(s.last_system_sync)}</div><div class="actions"><a href="/dashboard/users?target_ip=${encodeURIComponent(s.target_ip||'')}" class="btn secondary" onclick="event.stopPropagation()">Ver usuários</a><a href="/dashboard/telephony?target_ip=${encodeURIComponent(s.target_ip||'')}&kind=extensions" class="btn secondary" onclick="event.stopPropagation()">Ramais</a><a href="/dashboard/telephony?target_ip=${encodeURIComponent(s.target_ip||'')}&kind=huntgroups" class="btn secondary" onclick="event.stopPropagation()">Grupos</a><a href="/dashboard/provisioning?target_ip=${encodeURIComponent(s.target_ip||'')}" class="btn" onclick="event.stopPropagation()">Provisionar</a></div></article>`).join(''):'<div class="empty">Nenhum sistema descoberto.</div>';document.getElementById('failures').innerHTML=d.sync?.recent_failures?.length?d.sync.recent_failures.map(f=>`<div style="background:#fff;border:1px solid #dfe5ee;border-radius:10px;padding:12px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><strong>${esc(f.resource||'—')}</strong><small>${formatDate(f.created_at)}</small></div><div style="margin-top:6px;font-size:13px;color:#64748b">${esc(f.detail||'—')}</div><div style="margin-top:6px;font-size:12px;color:#94a3b8">Auditoria #${f.id || '—'}</div></div>`).join(''):'<div class="empty">Nenhuma falha registrada.</div>';document.getElementById('updated').textContent='Atualizado em '+formatDate(d.generated_at)}
if(token()){if(activeTargetIp){document.getElementById('target_ip').value=activeTargetIp;loadDashboard(activeTargetIp)}else{setMsg('Sess\u00e3o ativa. Sincronize com um IPO para carregar os dados.',true)}}else{sessionStorage.removeItem(dashboardTargetKey)}
</script>
</body></html>
